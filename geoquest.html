function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function playTone(f,d,t,v){try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v||0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function playCorrect(){playTone(523,0.12,'sine',0.25);setTimeout(()=>playTone(659,0.12,'sine',0.25),100);setTimeout(()=>playTone(784,0.18,'sine',0.25),200);}

function findCountryByName(name){
 for(const k of countryKeys){
  if(countries[k].name===name)return k;
 }
 return null;
}

function findCountryByCapital(capital){
 for(const k of countryKeys){
  if(countries[k].capital===capital)return k;
 }
 return null;
}

// ---- QUESTION GENERATION ----
function generateQuestions(count){
 const qs=[];
 const pool=[];

 // Country questions
 for(const k of countryKeys){
  const c=countries[k];
  pool.push({type:'country',prompt:'Click on '+c.name,answer:k});
  pool.push({type:'capital',prompt:'Click on the capital of '+c.name+': '+c.capital,answer:k});
 }

 // Landmark questions
 for(const lk of Object.keys(landmarks)){
  const lm=landmarks[lk];
  const ck=findCountryByName(lm.country);
  if(ck){
   pool.push({type:'landmark',prompt:'Click on: '+lm.name+' ('+lm.desc+')',answer:ck});
  }
 }

 // Flag questions
 for(const k of countryKeys){
  pool.push({type:'flag',prompt:'Which country has this flag?',answer:k});
 }

 // Shuffle and pick
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}

 for(let i=0;i<Math.min(count||50,pool.length);i++)qs.push(pool[i]);
 return qs;
}

function generateMarathonQuestions(){
 return generateQuestions(25);
}

function loadNextQuestion(){
 if(qIndex>=questionQueue.length){
  // Generate more
  questionQueue=generateQuestions(50);
  qIndex=0;
 }
 currentQuestion=questionQueue[qIndex++];
 totalQuestions++;
 timeLeft=diffIdx===0?15:7;
 showAnswer=false;
 flashTimer=0;
}

function checkClick(regionKey){
 if(!currentQuestion||showAnswer)return;
 const correct=currentQuestion.answer===regionKey;
 flashRegion=regionKey;

 if(correct){
  streak++;correctQuestions++;
  if(streak>maxStreak)maxStreak=streak;
  const mult=Math.min(streak,5);
  let pts=200*mult+Math.round(timeLeft*20);
  score+=pts;
  flashTimer=1.0;flashColor='#2ecc71';
  playCorrect();
  setTimeout(()=>{loadNextQuestion();},800);
 }else{
  streak=0;lives--;
  flashTimer=1.0;flashColor='#e74c3c';
  showAnswer=true;
  playIncorrect();
  if(lives<=0){
   setTimeout(()=>{
    state='gameover';
    gameOverStats={score,correctQuestions,totalQuestions,accuracy:totalQuestions>0?Math.round(correctQuestions/totalQuestions*100):0,maxStreak};
    if(score>highScore){highScore=score;localStorage.setItem('gq_highScore',highScore);}
    playGameOver();
   },500);
  }else{
   setTimeout(()=>{loadNextQuestion();},1500);
  }
 }
}

// ---- RENDERING ----
function drawFlag(ctx,x,y,w,h,colors){
 // Simplified flag rendering
 if(colors.length===2){
  // Two horizontal stripes
  const grad=ctx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0,colors[0]);grad.addColorStop(0.5,colors[0]);
  grad.addColorStop(0.5,colors[1]);grad.addColorStop(1,colors[1]);
  ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);
 }else if(colors.length===3){
  // Three vertical stripes (default)
  const stripeW=w/3;
  for(let i=0;i<3;i++){
   ctx.fillStyle=colors[i]||'#ffffff';
   ctx.fillRect(x+i*stripeW,y,stripeW+1,h);
  }
 }else{
  // Fallback
  ctx.fillStyle=colors[0]||'#ccc';
  ctx.fillRect(x,y,w,h);
 }
 // Border
 ctx.strokeStyle='#5c4033';ctx.lineWidth=2;
 ctx.strokeRect(x,y,w,h);
}

function drawMap(labels){
 // Draw SVG world map as background
 if(!window.worldMapImg){
  const img=new Image();
  img.src='/world-map.svg';
  window.worldMapImg=img;
 }
 const img=window.worldMapImg;
 if(img.complete&&img.naturalWidth>0){
  ctx.drawImage(img,0,0,W,H);
 } else {
  // Fallback water while loading
  ctx.fillStyle='#4682b4';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6b8e23';
  ctx.font='20px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('Loading world map...',W/2,H/2);
 }

 // Draw country highlights
 for(const k of countryKeys){
  const c=countries[k];
  // Flash region highlight - draw circle at center
  if(flashTimer>0&&flashRegion===k){
   ctx.beginPath();
   ctx.arc(c.cx,c.cy,15,0,Math.PI*2);
   ctx.fillStyle=flashColor;
   ctx.fill();
   ctx.strokeStyle='#fff';ctx.lineWidth=2;
   ctx.stroke();
  }
  // Labels
  if(labels){
   ctx.textAlign='center';
   ctx.font='bold 11px sans-serif';
   ctx.fillStyle='#ffffff';
   ctx.shadowColor='#000';ctx.shadowBlur=4;
   ctx.fillText(c.name,c.cx,c.cy);
   ctx.shadowBlur=0;
  }
 }

 // Decorative compass
 const cx=W-70,cy=70;
 ctx.save();
 ctx.translate(cx,cy);
 ctx.strokeStyle='#cd7f32';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#cd7f32';
 ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('N',0,-22);
 ctx.fillText('S',0,22);
 ctx.fillText('E',22,0);
 ctx.fillText('W',-22,0);
 ctx.restore();

 // Parchment border
 ctx.strokeStyle='#5c4033';ctx.lineWidth=4;
 ctx.strokeRect(2,2,W-4,H-4);
 ctx.strokeStyle='#cd7f32';ctx.lineWidth=2;
 ctx.strokeRect(6,6,W-12,H-12);
}

function drawGame(){
 // Draw map with labels (if easy mode)
 drawMap(diffIdx===0);

 // Question panel at top
 ctx.fillStyle='rgba(245,230,200,0.92)';
 ctx.fillRect(100,10,760,65);
 ctx.strokeStyle='#5c4033';ctx.lineWidth=2;
 ctx.strokeRect(100,10,760,65);

 ctx.textAlign='center';
 ctx.font='bold 20px sans-serif';
 ctx.fillStyle='#5c4033';
 if(currentQuestion){
  // Flag mode shows extra
  if(currentQuestion.type==='flag'){
   ctx.fillText(currentQuestion.prompt,W/2,40);
   // Show small flag
   const ck=currentQuestion.answer;
   if(countries[ck]){
    drawFlag(ctx,W/2-20,50,40,25,countries[ck].flagColors);
   }
  }else{
   ctx.fillText(currentQuestion.prompt,W/2,40);
  }
 }else{
  ctx.fillText('Click on the correct location!',W/2,40);
 }

 // Timer bar
 const barW=300,barH=12;
 const t=timeLeft/(diffIdx===0?15:7);
 ctx.fillStyle='#5c4033';
 ctx.fillRect(W/2-barW/2,78,barW,barH);
 ctx.fillStyle=t>0.3?'#2ecc71':t>0.15?'#f39c12':'#e74c3c';
 ctx.fillRect(W/2-barW/2+2,80,(barW-4)*Math.max(0,t),barH-4);

 // HUD
 ctx.textAlign='left';
 ctx.font='bold 18px "Courier New",Courier,monospace';
 ctx.fillStyle='#5c4033';
 ctx.fillText('Score: '+score,15,30);
 ctx.textAlign='right';
 ctx.fillStyle='#e74c3c';
 let hearts='';
 for(let i=0;i<lives;i++)hearts+='♥ ';
 ctx.fillText(hearts,W-15,30);
 ctx.textAlign='left';
 ctx.font='16px sans-serif';
 ctx.fillStyle='#cd7f32';
 ctx.fillText('Streak: '+streak+'x',15,52);
 ctx.fillStyle='#4682b4';
 ctx.fillText('Q: '+totalQuestions,15,72);

 // Show correct answer after wrong
 if(showAnswer&&currentQuestion){
  ctx.textAlign='center';
  ctx.font='18px sans-serif';
  ctx.fillStyle='#e74c3c';
  const ck=currentQuestion.answer;
  const cn=countries[ck]?countries[ck].name:ck;
  ctx.fillText('Answer: '+cn,480,95);
 }
}

function drawGameOver(){
 ctx.fillStyle='rgba(245,230,200,0.95)';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#5c4033';ctx.lineWidth=6;
 ctx.strokeRect(5,5,W-10,H-10);

 ctx.textAlign='center';
 ctx.shadowColor='#e74c3c';ctx.shadowBlur=15;
 ctx.font='bold 52px serif';
 ctx.fillStyle='#e74c3c';
 ctx.fillText('Expedition Complete',W/2,140);
 ctx.shadowBlur=0;

 ctx.font='28px sans-serif';ctx.fillStyle='#5c4033';
 ctx.fillText('Score: '+score,W/2,210);
 ctx.fillStyle='#cd7f32';
 ctx.fillText('High Score: '+highScore,W/2,250);

 ctx.font='20px sans-serif';ctx.fillStyle='#5c4033';
 ctx.fillText('Correct: '+gameOverStats.correctQuestions+' / '+gameOverStats.totalQuestions,W/2,300);
 ctx.fillText('Accuracy: '+gameOverStats.accuracy+'%',W/2,330);
 ctx.fillText('Best Streak: '+gameOverStats.maxStreak+'x',W/2,360);

 // Medal based on accuracy
 let medal='';
 if(gameOverStats.accuracy>=90)medal='★ GOLD ★';
 else if(gameOverStats.accuracy>=70)medal='★★ SILVER ★★';
 else if(gameOverStats.accuracy>=50)medal='★★★ BRONZE ★★★';
 if(medal){
  ctx.font='bold 24px sans-serif';
  ctx.fillStyle='#cd7f32';
  ctx.fillText(medal,W/2,410);
 }

 ctx.font='22px sans-serif';ctx.fillStyle='#2ecc71';
 ctx.fillText('Press Enter to Play Again',W/2,500);
}

function drawPaused(){
 ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 ctx.font='bold 48px serif';
 ctx.fillStyle='#f5e6c8';
 ctx.fillText('PAUSED',W/2,H/2-20);
 ctx.font='20px sans-serif';
 ctx.fillStyle='#ffffff';
 ctx.fillText('Press Esc or P to resume',W/2,H/2+30);
}

// ---- POINT-IN-POLYGON ----
function pointInPolygon(px,py,poly){
 let inside=false;
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const xi=poly[i][0],yi=poly[i][1];
  const xj=poly[j][0],yj=poly[j][1];
  if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi){
   inside=!inside;
  }
 }
 return inside;
}

function findCountryAtPoint(x,y){
 for(const k of countryKeys){
  const c=countries[k];
  if(pointInPolygon(x,y,c.poly))return k;
 }
 return null;
}

// ---- PARTICLES ----
let particles=[];
function spawnConfetti(x,y,count){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,s=Math.random()*150+30;
  const colors=['#cd7f32','#2ecc71','#4682b4','#f5e6c8','#e74c3c','#ffcc00'];
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:1,decay:0.01+Math.random()*0.02,size:3+Math.random()*4,color:colors[Math.floor(Math.random()*colors.length)]});
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;
  p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
 }
}

// ---- UPDATE ----
function updatePlaying(dt){
 if(flashTimer>0)flashTimer-=dt;

 // Timer countdown
 if(!showAnswer){
  timeLeft-=dt;
  if(timeLeft<=0){
   timeLeft=0;
   // Timeout = wrong answer
   streak=0;lives--;
   flashTimer=1.0;flashColor='#e74c3c';
   showAnswer=true;
   playIncorrect();
   if(lives<=0){
    setTimeout(()=>{
     state='gameover';
     gameOverStats={score,correctQuestions,totalQuestions,accuracy:totalQuestions>0?Math.round(correctQuestions/totalQuestions*100):0,maxStreak};
     if(score>highScore){highScore=score;localStorage.setItem('gq_highScore',highScore);}
     playGameOver();
    },500);
   }else{
    setTimeout(()=>{loadNextQuestion();},1500);
   }
  }
 }
 updateParticles(dt);
}

// ---- MAIN LOOP ----
let lastTime=0;

function gameLoop(timestamp){
 const dt=Math.min((timestamp-lastTime)/1000,0.05);
 lastTime=timestamp;

 ctx.save();

 if(state==='title'){
  drawTitle();
  if(justPressed('ArrowUp')||justPressed('w')||justPressed('W')){mode=(mode-1+5)%5;}
  if(justPressed('ArrowDown')||justPressed('s')||justPressed('S')){mode=(mode+1)%5;}
  if(justPressed('d')||justPressed('D')){diffIdx=(diffIdx+1)%2;}
  if(justPressed('Enter')||justPressed(' ')){
   state='playing';
   score=0;lives=3;streak=0;maxStreak=0;qIndex=0;totalQuestions=0;correctQuestions=0;
   if(mode===4){
    questionQueue=generateMarathonQuestions();
   }else{
    // Mode-specific question filter
    const allQs=generateQuestions(100);
    questionQueue=allQs.filter(q=>{
     if(mode===0)return q.type==='country';
     if(mode===1)return q.type==='capital';
     if(mode===2)return q.type==='landmark';
     if(mode===3)return q.type==='flag';
     return true;
    });
    // Limit to 20
    questionQueue=questionQueue.slice(0,20);
   }
   qIndex=0;
   loadNextQuestion();
   initAudio();
  }
  if(mouse.clicked){
   const my=mouse.y;
   if(my>=285&&my<465){
    const idx=Math.floor((my-285)/36);
    if(idx>=0&&idx<5)mode=idx;
   }
   if(my>=495&&my<520){
    const idx=Math.floor((mouse.x-(W/2-60))/200);
    if(idx>=0&&idx<2)diffIdx=idx;
   }
   if(my>=540&&my<580){
    state='playing';
    score=0;lives=3;streak=0;maxStreak=0;qIndex=0;totalQuestions=0;correctQuestions=0;
    if(mode===4)questionQueue=generateMarathonQuestions();
    else{
     const allQs=generateQuestions(100);
     questionQueue=allQs.filter(q=>{
      if(mode===0)return q.type==='country';
      if(mode===1)return q.type==='capital';
      if(mode===2)return q.type==='landmark';
      if(mode===3)return q.type==='flag';
      return true;
     }).slice(0,20);
    }
    qIndex=0;loadNextQuestion();initAudio();
   }
   mouse.clicked=false;
  }
  for(const k in keys)if(keys[k]===2)keys[k]=1;
  ctx.restore();
  requestAnimationFrame(gameLoop);return;
 }

 if(state==='playing'||state==='paused'){
  if(paused||justPressed('Escape')||justPressed('p')||justPressed('P')){
   paused=!paused;
  }
  if(paused){
   drawGame();
   drawPaused();
   for(const k in keys)if(keys[k]===2)keys[k]=1;
   ctx.restore();
   requestAnimationFrame(gameLoop);return;
  }

  updatePlaying(dt);
  drawGame();

  // Draw particles
  for(const p of particles){
   ctx.globalAlpha=p.life;
   ctx.fillStyle=p.color;
   ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // Click handling
  if(mouse.prevClicked&&!showAnswer){
   const rk=findCountryAtPoint(mouse.x,mouse.y);
   if(rk){
    checkClick(rk);
    if(flashColor==='#2ecc71'){
     spawnConfetti(mouse.x,mouse.y,20);
    }
   }
   mouse.prevClicked=false;
  }
 }

 if(state==='gameover'){
  drawGameOver();
  updateParticles(dt);
  for(const p of particles){
   ctx.globalAlpha=p.life;
   ctx.fillStyle=p.color;
   ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  if(justPressed('Enter')||justPressed(' ')){state='title';}
  if(mouse.clicked&&mouse.y>470&&mouse.y<530){state='title';mouse.clicked=false;}
 }

 for(const k in keys)if(keys[k]===2)keys[k]=1;
 if(mouse.clicked)mouse.clicked=false;

 ctx.restore();
 requestAnimationFrame(gameLoop);
}

// Handle resize
function resizeCanvas(){
 const container=document.getElementById('gameContainer');
 const scale=Math.min(container.clientWidth/W,container.clientHeight/H);
 canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

requestAnimationFrame(gameLoop);
})();
</script>
