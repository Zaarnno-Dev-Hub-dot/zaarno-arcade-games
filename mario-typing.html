function ensureAudio() {
  if (typeof initAudio === 'function') initAudio();
  else if (typeof getAudioContext === 'function') getAudioContext();

  mario: null,

  marioJump: null,
  goomba: null,
  koopa: null,
  mushroom: null
};

let spritesLoaded = false;

function loadGameSprites() {
  const base = 'assets/mario-sprites/';
  const toLoad = [
    { key: 'mario', file: '1.jpg' },
    { key: 'marioRun', file: '2.jpg' },
    { key: 'marioJump', file: '3.jpg' },
    { key: 'goomba', file: '4.jpg' },
    { key: 'mushroom', file: '5.jpg' }
  ];

  let loadedCount = 0;
  const total = toLoad.length;

  toLoad.forEach(item => {
    const img = new Image();
    img.onload = () => {
      sprites[item.key] = img;
      loadedCount++;
      if (loadedCount === total) {
        spritesLoaded = true;
        console.log('[Mario Typing] AI-generated sprites loaded successfully!');
      }
    };
    img.onerror = () => {
      loadedCount++;
      console.warn(`[Mario Typing] Could not load sprite ${item.file} - using programmatic fallback`);
    };
    img.src = base + item.file;
  });
}

// Call on load

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playBeep(freq = 440, duration = 0.08, type = 'square', volume = 0.3) {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = type;
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = 1200;

    gain.gain.value = volume;
    gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + duration);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + duration + 0.02);
  } catch (e) {
    // Silent fail if audio blocked
  }
}

function playTypingSound(correct = true) {
  if (correct) {
    playBeep(880, 0.06, 'square', 0.25);
  } else {
    playBeep(220, 0.12, 'sawtooth', 0.35);
  }
}

function playPowerupSound(type = 'mushroom') {
  if (type === 'mushroom') playBeep(660, 0.15, 'sine', 0.4);
  else if (type === 'star') playBeep(880, 0.25, 'triangle', 0.35);
  else playBeep(550, 0.18, 'square', 0.3);
}

function playEnemyDefeat() {
  playBeep(1200, 0.05, 'square', 0.3);
  setTimeout(() => playBeep(900, 0.08, 'square', 0.25), 60);
}

function playBossHit() {

}

  [659, 659, 659, 523, 659, 784].forEach((f, i) => {
    setTimeout(() => playBeep(f, 0.12, 'square', 0.35), i * 120);
  });
}

// ============================================================
// AUDIO SYSTEM (Web Audio API)
// ============================================================
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let musicOsc = null;
let musicPlaying = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.15;
  musicGain.connect(masterGain);
  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.4;
  sfxGain.connect(masterGain);
}

function playTone(freq, duration, type='square', gain=0.15, dest=null) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(g);
    g.connect(dest || sfxGain);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

      {note:'E5',dur:0.12},{note:'C5',dur:0.12},{note:'A4',dur:0.12},{note:'F4',dur:0.12},
    ]
  };
  const melody = melodies[theme] || melodies.overworld;
  let idx = 0;
  let timer = 0;
  const bpm = theme==='underwater'?80:theme==='castle'?130:theme==='underground'?100:120;
  const beatDur = 60/bpm;
  let totalTime = 0;
  melody.forEach(m => { totalTime += m.dur; });
  if (musicOsc) try { musicOsc.stop(); } catch(e){}
  
  function playNext() {
    if (!musicPlaying) return;
    const m = melody[idx % melody.length];
    if (m.note !== 'R' && noteMap[m.note]) {
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(noteMap[m.note], audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + m.dur * beatDur);
        osc.connect(g);
        g.connect(musicGain);
        osc.start();
        osc.stop(audioCtx.currentTime + m.dur * beatDur);
      } catch(e){}
    }
    idx++;
    setTimeout(playNext, m.dur * beatDur * 1000);
  }
  playNext();
}

function drawMario(ctx, x, y, frame, scale=1) {
  const img = (frame % 3 === 1 && sprites.marioRun) ? sprites.marioRun :
              (frame % 3 === 2 && sprites.marioJump) ? sprites.marioJump :
              sprites.mario;

  if (spritesLoaded && img) {
    // Use AI-generated image sprite
    const w = 32 * scale;
    const h = 32 * scale;
    ctx.drawImage(img, x, y - h * 0.2, w, h);  // Adjust offset for alignment
    return;
  }

  // Fallback: original programmatic pixel art
  const s = scale * 2;
  ctx.save();
  // Body (red)
  ctx.fillStyle = NES.RED;
  ctx.fillRect(x+2*s, y+4*s, 4*s, 3*s);
  // Hat
  ctx.fillStyle = NES.RED;
  ctx.fillRect(x+1*s, y, 6*s, 2*s);
  ctx.fillRect(x+2*s, y+2*s, 4*s, 1*s);
  // Face
  ctx.fillStyle = NES.SKIN;
  ctx.fillRect(x+2*s, y+3*s, 4*s, 2*s);
  // Eyes
  ctx.fillStyle = NES.BLACK;
  if (frame===0) { ctx.fillRect(x+3*s, y+3*s, 1*s, 1*s); ctx.fillRect(x+5*s, y+3*s, 1*s, 1*s); }
  else { ctx.fillRect(x+2*s, y+3*s, 1*s, 1*s); ctx.fillRect(x+5*s, y+3*s, 1*s, 1*s); }
  // Mustache
  ctx.fillStyle = NES.BROWN;
  ctx.fillRect(x+3*s, y+4*s, 3*s, 1*s);
  // Overalls (blue)
  ctx.fillStyle = NES.BLUE;
  ctx.fillRect(x+2*s, y+7*s, 4*s, 3*s);
  // Legs
  ctx.fillStyle = NES.DARK_BLUE;
  if (frame%2===0) {
    ctx.fillRect(x+2*s, y+10*s, 2*s, 2*s);
    ctx.fillRect(x+4*s, y+10*s, 2*s, 2*s);
  } else {
    ctx.fillRect(x+2*s, y+10*s, 2*s, 1*s);
    ctx.fillRect(x+4*s, y+10*s, 2*s, 2*s);
  }
  // Shoes
  ctx.fillStyle = NES.BROWN;
  ctx.fillRect(x+2*s, y+12*s, 2*s, 1*s);
  ctx.fillRect(x+4*s, y+12*s, 2*s, 1*s);
  ctx.restore();
}

function drawGoomba(ctx, x, y, frame, scale=1) {
  const s = scale * 2;
  ctx.save();
  // Body (brown dome)
  ctx.fillStyle = NES.BROWN;
  ctx.beginPath();
  ctx.arc(x+4*s, y+4*s, 4*s, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x, y+4*s, 8*s, 4*s);
  // Feet
  ctx.fillStyle = NES.DARK_GREY;
  if (frame%2===0) {
    ctx.fillRect(x, y+8*s, 3*s, 2*s);
    ctx.fillRect(x+5*s, y+8*s, 3*s, 2*s);
  } else {
    ctx.fillRect(x, y+8*s, 2*s, 2*s);
    ctx.fillRect(x+6*s, y+8*s, 2*s, 2*s);
  }
  // Angry eyebrows
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(x+2*s, y+3*s, 2*s, 1*s);
  ctx.fillRect(x+5*s, y+3*s, 2*s, 1*s);
  // Eyes
  ctx.fillStyle = NES.WHITE;
  ctx.fillRect(x+2*s, y+4*s, 1*s, 2*s);
  ctx.fillRect(x+5*s, y+4*s, 1*s, 2*s);
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(x+2*s, y+5*s, 1*s, 1*s);
  ctx.fillRect(x+5*s, y+5*s, 1*s, 1*s);
  ctx.restore();
}

function drawKoopa(ctx, x, y, frame, scale=1) {
  const s = scale * 2;
  ctx.save();
  // Shell (green)
  ctx.fillStyle = NES.DARK_GREEN;
  ctx.beginPath();
  ctx.arc(x+4*s, y+5*s, 4*s, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x, y+5*s, 8*s, 3*s);
  // Shell pattern
  ctx.fillStyle = NES.GREEN;
  ctx.fillRect(x+3*s, y+3*s, 2*s, 2*s);
  // Head
  ctx.fillStyle = NES.GREEN;
  ctx.fillRect(x+6*s, y+2*s, 3*s, 3*s);
  // Eyes
  ctx.fillStyle = NES.WHITE;
  ctx.fillRect(x+7*s, y+2*s, 1*s, 2*s);
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(x+7*s, y+3*s, 1*s, 1*s);
  // Feet
  ctx.fillStyle = NES.YELLOW;
  if (frame%2===0) {
    ctx.fillRect(x+1*s, y+8*s, 2*s, 2*s);
    ctx.fillRect(x+5*s, y+8*s, 2*s, 2*s);
  } else {
    ctx.fillRect(x+2*s, y+8*s, 2*s, 2*s);
    ctx.fillRect(x+4*s, y+8*s, 2*s, 2*s);
  }
  ctx.restore();
}

function drawPiranha(ctx, x, y, frame, scale=1) {
  const s = scale * 2;
  ctx.save();
  // Stem (green)
  ctx.fillStyle = NES.DARK_GREEN;
  ctx.fillRect(x+3*s, y+6*s, 2*s, 4*s);
  // Head (green circle)
  ctx.fillStyle = NES.GREEN;
  ctx.beginPath();
  ctx.arc(x+4*s, y+4*s, 4*s, 0, Math.PI*2);
  ctx.fill();
  // Mouth
  ctx.fillStyle = NES.RED;
  if (frame%2===0) {
    ctx.fillRect(x+2*s, y+4*s, 4*s, 2*s);
  } else {
    ctx.fillRect(x+2*s, y+3*s, 4*s, 2*s);
  }
  // Teeth
  ctx.fillStyle = NES.WHITE;
  ctx.fillRect(x+2*s, y+4*s, 1*s, 1*s);
  ctx.fillRect(x+5*s, y+4*s, 1*s, 1*s);
  // Eyes
  ctx.fillStyle = NES.WHITE;
  ctx.fillRect(x+2*s, y+2*s, 2*s, 2*s);
  ctx.fillRect(x+5*s, y+2*s, 2*s, 2*s);
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(x+2*s, y+2*s, 1*s, 1*s);
  ctx.fillRect(x+5*s, y+2*s, 1*s, 1*s);
  ctx.restore();
}

function drawBowser(ctx, x, y, frame, scale=1) {
  const s = scale * 2.5;
  ctx.save();
  // Body (green)
  ctx.fillStyle = NES.DARK_GREEN;
  ctx.fillRect(x+2*s, y+4*s, 8*s, 6*s);
  // Shell spikes
  ctx.fillStyle = NES.YELLOW;
  ctx.fillRect(x+s, y+4*s, 2*s, 2*s);
  ctx.fillRect(x+4*s, y+3*s, 2*s, 2*s);
  ctx.fillRect(x+7*s, y+4*s, 2*s, 2*s);
  // Head
  ctx.fillStyle = NES.GREEN;
  ctx.beginPath();
  ctx.arc(x+5*s, y+3*s, 4*s, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x+s, y+3*s, 8*s, 2*s);
  // Hair
  ctx.fillStyle = NES.RED;
  ctx.fillRect(x+2*s, y-1*s, 6*s, 2*s);
  ctx.fillRect(x+s, y+s, 2*s, 2*s);
  ctx.fillRect(x+8*s, y+s, 2*s, 2*s);
  // Eyes
  ctx.fillStyle = NES.WHITE;
  ctx.fillRect(x+2*s, y+2*s, 2*s, 2*s);
  ctx.fillRect(x+6*s, y+2*s, 2*s, 2*s);
  ctx.fillStyle = NES.RED;
  ctx.fillRect(x+3*s, y+3*s, 1*s, 1*s);
  ctx.fillRect(x+7*s, y+3*s, 1*s, 1*s);
  // Mouth
  ctx.fillStyle = NES.YELLOW;
  ctx.fillRect(x+3*s, y+5*s, 4*s, 2*s);
  // Fire breath
  if (frame%4<2) {
    ctx.fillStyle = NES.ORANGE;
    ctx.fillRect(x+10*s, y+4*s, 3*s, 2*s);
    ctx.fillStyle = NES.RED;
    ctx.fillRect(x+12*s, y+5*s, 2*s, 1*s);
  }
  // Feet
  ctx.fillStyle = NES.BROWN;
  ctx.fillRect(x+s, y+10*s, 3*s, 2*s);
  ctx.fillRect(x+7*s, y+10*s, 3*s, 2*s);
  ctx.restore();
}

function drawQBlock(ctx, x, y, frame, scale=1) {
  const s = scale * 2;
  ctx.save();
  // Block
  ctx.fillStyle = NES.YELLOW;
  ctx.fillRect(x, y, 8*s, 8*s);
  ctx.strokeStyle = NES.BROWN;
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, 8*s, 8*s);
  // Question mark
  ctx.fillStyle = NES.WHITE;
  ctx.font = `${6*s}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('?', x+4*s, y+6*s);
  // Shine
  if (frame%60<30) {
    ctx.fillStyle = NES.WHITE;
    ctx.fillRect(x+s, y+s, 2*s, 2*s);
  }
  ctx.restore();
}

// ============================================================

const game = {
  state: STATE.TITLE,
  score: 0,
  lives: 3,

  totalDefeated: 0,
  totalTyped: 0,
  correctTyped: 0,
  levelIndex: 0,
  wavesCompleted: 0,
  enemiesOnScreen: [],
  activeEnemy: null,
  typedBuffer: '',
  particles: [],
  powerups: [],
  blocks: [],
  activePowerups: {},
  screenShake: 0,
  starsEarned: 0,
  totalTime: 0,
  levelTime: 0,
  menuSelection: 0,

  currentBoss: null,
  bossIntroTimer: 0,
  showBossIntro: false,

  bgOffset: 0,

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randF(min, max) { return Math.random() * (max - min) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function getLevelConfig() {
  return LEVEL_CONFIGS[game.levelIndex] || LEVEL_CONFIGS[0];
}

function getWordsForDifficulty(diff) {
  const w = WORDS[diff] || WORDS.easy;
  // Filter out words similar to current active words to avoid duplicates
  const activeWords = game.enemiesOnScreen.map(e => e.word);
  const available = w.filter(word => !activeWords.includes(word));
  return available.length > 0 ? available : w;
}

function getRandomWord(diff) {
  const words = getWordsForDifficulty(diff);
  return words[rand(0, words.length-1)];
}

// ============================================================
// ENEMY SPAWNING
// ============================================================
function spawnEnemy() {
  const config = getLevelConfig();
  const diff = config.difficulty;
  let word = getRandomWord(diff);
  let hp = 1;
  let type = 'goomba';
  let speed = 0.3 + (config.speedMultiplier-1) * 0.4;
  let scale = 1;

  // Weight enemy types by difficulty
  const roll = Math.random();
  if (diff === 'easy') {
    type = roll < 0.8 ? 'goomba' : 'koopa';
  } else if (diff === 'medium') {
    type = roll < 0.5 ? 'goomba' : roll < 0.85 ? 'koopa' : 'piranha';
  } else if (diff === 'hard') {
    type = roll < 0.3 ? 'goomba' : roll < 0.6 ? 'koopa' : 'piranha';
  } else {
    type = roll < 0.25 ? 'goomba' : roll < 0.5 ? 'koopa' : 'piranha';
  }

  if (type === 'piranha') speed *= 1.2;
  if (type === 'koopa') speed *= 1.1;

  // Boss encounter? No, that's handled separately

  const enemy = {
    x: W + 20,
    y: rand(200, 500),
    type: type,
    word: word,
    typedSoFar: '',
    hp: hp,
    maxHp: hp,
    speed: speed,
    scale: scale,
    frame: 0,
    frameTimer: 0,
    alive: true,
    deathTimer: 0,
    flashTimer: 0,
    wrongFlash: false,
    wordHeight: 0,
  };
  game.enemiesOnScreen.push(enemy);
}

function spawnBoss() {
  const config = getLevelConfig();
  const bossType = config.bossType;
  const words = BOSS_WORDS[bossType] || BOSS_WORDS.goomba;
  const word = words[rand(0, words.length-1)];

  const boss = {
    x: W + 30,
    y: 250,
    type: 'boss_' + bossType,
    word: word,
    typedSoFar: '',
    hp: 15 + Math.floor(game.levelIndex * 2),
    maxHp: 15 + Math.floor(game.levelIndex * 2),
    speed: 0.15,
    scale: 2,
    frame: 0,
    frameTimer: 0,
    alive: true,
    deathTimer: 0,
    flashTimer: 0,
    wrongFlash: false,
    bossType: bossType,
    isBoss: true,
    wordHeight: 0,
    fireTimer: 0,
  };
  game.enemiesOnScreen.push(boss);
  game.currentBoss = boss;
  playSFX('bossHit');
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(x, y, color, count=10) {
  for (let i = 0; i < count; i++) {
    game.particles.push({
      x: x, y: y,
      vx: randF(-3, 3),
      vy: randF(-5, -1),
      life: rand(20, 40),
      maxLife: 40,
      color: color,
      size: rand(2, 5),
    });
  }
}

// ============================================================
// POWER-UPS
// ============================================================
function spawnPowerup(x, y) {
  const types = ['mushroom', 'flower', 'star', 'clock', 'oneup'];
  const type = types[rand(0, types.length-1)];
  game.powerups.push({
    x: x, y: y, type: type,
    vy: -2, vx: 0,
    alive: true,
    timer: 0,
    frame: 0,
  });
}

function activatePowerup(type) {
  switch(type) {
    case 'mushroom':
      playSFX('powerup');
      game.activePowerups.mushroom = 600; // 10 seconds at 60fps
      break;
    case 'flower':
      playSFX('fireflower');
      game.activePowerups.flower = 3; // 3 auto-defeats
      break;
    case 'star':
      playSFX('powerup');
      game.activePowerups.star = 600;
      break;
    case 'oneup':
      playSFX('oneUp');
      game.lives++;
      break;
    case 'clock':
      playSFX('powerup');
      game.activePowerups.clock = 1200;
      // Slow all enemies
      game.enemiesOnScreen.forEach(e => { e.speed *= 0.5; });
      break;
  }
}

// ============================================================
// TYPING LOGIC
// ============================================================
function findActiveEnemy() {
  // Find the closest enemy to the left (most threatening)
  let closest = null;
  let minDist = Infinity;
  for (const e of game.enemiesOnScreen) {
    if (!e.alive) continue;
    if (e.x < minDist && e.x > 0) {
      minDist = e.x;
      closest = e;
    }
  }
  return closest;
}

function handleTyping(char) {
  if (game.state !== STATE.GAMEPLAY) return;
  if (!game.activeEnemy || !game.activeEnemy.alive) {
    game.activeEnemy = findActiveEnemy();
    if (!game.activeEnemy) return;
  }

  const e = game.activeEnemy;
  const expectedChar = e.word[e.typedSoFar.length];
  if (!expectedChar) {
    // Word already complete, find next enemy
    game.activeEnemy = findActiveEnemy();
    return;
  }
  game.totalTyped++;
  if (char.toLowerCase() === expectedChar) {
    e.typedSoFar += char.toLowerCase();
    game.correctTyped++;
    playSFX('typeCorrect');
    spawnParticles(e.x, e.y, NES.GREEN, 3);

    // Word complete!
    if (e.typedSoFar.length === e.word.length) {
      defeatEnemy(e);
    }
  } else {
    // Wrong character - reset combo and progress
    game.combo = 0;
    e.wrongFlash = true;
    e.flashTimer = 10;
    playSFX('typeWrong');
    // Reset typed progress
    e.typedSoFar = '';
    game.activeEnemy = findActiveEnemy();
  }
}

function defeatEnemy(e) {
  e.alive = false;
  e.deathTimer = 20;
  game.totalDefeated++;
  game.combo++;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;

  const multiplier = Math.min(game.combo, 10);
  let points = 100 * multiplier;

  if (e.isBoss) {
    points = 5000;
    playSFX('levelClear');
    spawnParticles(e.x, e.y, NES.YELLOW, 30);
    spawnParticles(e.x, e.y, NES.RED, 20);
  } else {
    playSFX('enemyDefeat');
    spawnParticles(e.x, e.y, NES.ORANGE, 8);
  }

  // Power-up effects
  if (game.activePowerups.mushroom > 0) points *= 2;
  if (game.activePowerups.star > 0) {
    // Auto-defeat nearby enemies
    game.enemiesOnScreen.forEach(other => {
      if (other !== e && other.alive && Math.abs(other.x - e.x) < 100) {
        other.alive = false;
        other.deathTimer = 20;
        spawnParticles(other.x, other.y, NES.YELLOW, 8);
      }
    });
  }
  if (game.activePowerups.flower > 0) {
    game.activePowerups.flower--;
  }

  game.score += points;
  game.activeEnemy = null;

  // Extra life every 10,000 points
  if (game.score >= 10000 && game.score - points < 10000) {
    game.lives++;
    playSFX('oneUp');
  }

  // If boss defeated
  if (e.isBoss) {
    setTimeout(() => {
      game.state = STATE.VICTORY;
      game.victoryTimer = 300;
    }, 1000);
  }
}

// ============================================================
// LEVEL MANAGEMENT
// ============================================================
function startLevel(index) {
  game.levelIndex = index;
  game.wavesCompleted = 0;
  game.enemiesOnScreen = [];
  game.particles = [];
  game.powerups = [];
  game.blocks = [];
  game.activePowerups = {};
  game.typedBuffer = '';
  game.activeEnemy = null;
  game.currentBoss = null;
  game.bossSpawned = false;
  game.bossDefeated = false;
  game.levelTime = 0;
  game.combo = 0;
  game.screenShake = 0;
  game.bgOffset = 0;
  game.state = STATE.GAMEPLAY;
  game.showBossIntro = false;

  const config = getLevelConfig();
  startMusic(config.theme);

  // Generate ?-blocks
  for (let i = 0; i < 3; i++) {
    game.blocks.push({
      x: 200 + rand(0, 400),
      y: 350 + rand(0, 150),
      type: 'question',
      used: false,
      frame: rand(0, 60),
    });
  }

  // Spawn initial wave
  setTimeout(() => spawnWave(), 500);
}

function spawnWave() {
  const config = getLevelConfig();
  if (config.hasBoss && !game.bossSpawned && game.wavesCompleted >= config.totalWaves - 1) {
    // Spawn boss
    game.bossSpawned = true;
    game.bossIntroTimer = 120;
    game.showBossIntro = true;
    setTimeout(() => {
      spawnBoss();
      game.showBossIntro = false;
    }, 2000);
    return;
  }

  const count = config.enemiesPerWave;
  for (let i = 0; i < count; i++) {
    setTimeout(() => spawnEnemy(), i * 400);
  }
  game.wavesCompleted++;
}

function checkAllEnemiesDead() {
  const alive = game.enemiesOnScreen.filter(e => e.alive || e.deathTimer > 0);
  return alive.length === 0;
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  game.frameCount++;

  switch(game.state) {
    case STATE.TITLE:
      updateTitle();
      break;
    case STATE.LEVEL_SELECT:
      updateLevelSelect();
      break;
    case STATE.GAMEPLAY:
      updateGameplay();
      break;
    case STATE.PAUSE:
      break;
    case STATE.GAMEOVER:
      updateGameOver();
      break;
    case STATE.VICTORY:
      updateVictory();
      break;
    case STATE.LEADERBOARD:
      break;
    case STATE.BOSS_INTRO:
      updateBossIntro();
      break;
    case STATE.CONTINUE:
      break;
  }
}

function updateTitle() {
  // Decorative floating elements
  game.bgOffset += 0.5;
}

function updateLevelSelect() {
  if (game.levelIndex < 0) game.levelIndex = 0;
  if (game.levelIndex >= LEVEL_CONFIGS.length) game.levelIndex = LEVEL_CONFIGS.length - 1;
}

function updateGameplay() {
  if (game.levelTime === 0) game.levelTime = 1;

  const config = getLevelConfig();
  game.levelTime++;

  // Parallax scroll
  game.bgOffset += 0.5;

  // Update powerup timers
  for (const key in game.activePowerups) {
    if (game.activePowerups[key] > 0) {
      game.activePowerups[key]--;
      if (game.activePowerups[key] === 0 && key === 'clock') {
        // Restore enemy speed
        game.enemiesOnScreen.forEach(e => { e.speed *= 2; });
      }
    }
  }

  // Update enemies
  let allDead = true;
  for (let i = game.enemiesOnScreen.length - 1; i >= 0; i--) {
    const e = game.enemiesOnScreen[i];

    if (!e.alive) {
      if (e.deathTimer > 0) e.deathTimer--;
      else { game.enemiesOnScreen.splice(i, 1); continue; }
      continue;
    }

    allDead = false;
    e.frameTimer++;
    if (e.frameTimer > 15) { e.frameTimer = 0; e.frame = (e.frame + 1) % 4; }

    // Move left
    let speed = e.speed;
    if (e.isBoss) {
      speed = e.speed;
    } else {
      speed *= (1 + game.levelTime * 0.0005); // Gradual speed increase
      if (e.speed) {}
    }
    e.x -= speed;

    // Flash timer
    if (e.flashTimer > 0) e.flashTimer--;

    // Check if reached left edge
    if (e.x < -50) {
      if (e.isBoss) {
        // Boss got through - lose a life
        loseLife();
        e.alive = false;
      } else {
        loseLife();
        e.alive = false;
      }
    }

    // Fire breath for bowser
    if (e.isBoss && e.bossType === 'bowser') {
      e.fireTimer++;
      if (e.fireTimer % 120 === 0) {
        // Fire attack - create particle stream
        for (let j = 0; j < 5; j++) {
          game.particles.push({
            x: e.x - 10, y: e.y + 20 + rand(-10, 10),
            vx: -3 - randF(0, 2), vy: randF(-0.5, 0.5),
            life: rand(20, 40), maxLife: 40,
            color: NES.ORANGE, size: rand(3, 6),
          });
        }
      }
    }
  }

  // Update particles
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life--;
    if (p.life <= 0) game.particles.splice(i, 1);
  }

  // Update powerups on screen
  for (let i = game.powerups.length - 1; i >= 0; i--) {
    const p = game.powerups[i];
    p.y += p.vy;
    p.vy += 0.05;
    p.timer++;
    // Check collision with player zone
    if (p.x < 100 && p.alive) {
      activatePowerup(p.type);
      p.alive = false;
      game.powerups.splice(i, 1);
    }
    if (p.y > 600 || p.x < -50 || p.x > W+50) {
      game.powerups.splice(i, 1);
    }
  }

  // Auto-defeat with star
  if (game.activePowerups.star > 0) {
    game.enemiesOnScreen.forEach(e => {
      if (e.alive && !e.isBoss) {
        e.alive = false;
        e.deathTimer = 15;
        spawnParticles(e.x, e.y, NES.YELLOW, 8);
        game.score += 100;
        game.totalDefeated++;
      }
    });
  }

  // Check if we need to spawn next wave
  if (allDead && !game.showBossIntro) {
    spawnWave();
  }

  // Screen shake decay
  if (game.screenShake > 0) game.screenShake *= 0.9;
  if (game.screenShake < 0.1) game.screenShake = 0;
}

function updateGameOver() {
  game.gameOverTimer--;
  if (game.gameOverTimer <= 0) {
    game.gameOverTimer = 0;
    if (game.continueLives > 0) {
      game.state = STATE.CONTINUE;
    }
  }
}

function updateVictory() {
  game.victoryTimer--;
  if (game.victoryTimer <= 0) {
    if (game.victoryTimer > -100) {
      saveScore('Player');
    }
    game.victoryTimer = -100; // Prevent re-saving
  }
}

function updateBossIntro() {
  game.bossIntroTimer--;
}

function loseLife() {
  game.lives--;
  game.combo = 0;
  game.activeEnemy = null;
  game.screenShake = 10;
  playSFX('stomp');

  if (game.lives <= 0) {
    game.state = STATE.GAMEOVER;
    game.gameOverTimer = 180;
    game.continueLives = 3;
    playSFX('gameOver');
    stopMusic();
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  ctx.save();

  // Screen shake
  if (game.screenShake > 0.5) {
    const sx = (Math.random() - 0.5) * game.screenShake;
    const sy = (Math.random() - 0.5) * game.screenShake;
    ctx.translate(sx, sy);
  }

  // Clear
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(0, 0, W, H);

  switch(game.state) {
    case STATE.TITLE: renderTitle(); break;
    case STATE.LEVEL_SELECT: renderLevelSelect(); break;
    case STATE.GAMEPLAY: renderGameplay(); break;
    case STATE.PAUSE: renderPause(); break;
    case STATE.GAMEOVER: renderGameOver(); break;
    case STATE.VICTORY: renderVictory(); break;
    case STATE.LEADERBOARD: renderLeaderboard(); break;
    case STATE.CONTINUE: renderContinue(); break;
    case STATE.BOSS_INTRO: renderBossIntro(); break;
  }

  ctx.restore();
}

function drawBackground(theme) {
  const offset = game.bgOffset;

  switch(theme) {
    case 'overworld':
      // Sky
      ctx.fillStyle = NES.SKY;
      ctx.fillRect(0, 0, W, H);
      // Hills
      ctx.fillStyle = NES.DARK_GREEN;
      for (let i = -1; i < 5; i++) {
        const hx = i * 200 - (offset * 0.3 % 200);
        ctx.beginPath();
        ctx.arc(hx + 100, 520, 80, Math.PI, 0);
        ctx.fill();
      }
      ctx.fillStyle = NES.GREEN;
      for (let i = -1; i < 5; i++) {
        const hx = i * 250 - (offset * 0.2 % 250) + 50;
        ctx.beginPath();
        ctx.arc(hx + 100, 520, 60, Math.PI, 0);
        ctx.fill();
      }
      // Clouds
      ctx.fillStyle = NES.WHITE;
      for (let i = -1; i < 4; i++) {
        const cx = i * 300 - (offset * 0.1 % 300);
        ctx.fillRect(cx, 60, 60, 20);
        ctx.fillRect(cx+10, 45, 40, 20);
        ctx.fillRect(cx+20, 35, 20, 15);
      }
      break;
    case 'underground':
      ctx.fillStyle = NES.DARK_GREY;
      ctx.fillRect(0, 0, W, H);
      // Cave walls
      ctx.fillStyle = NES.BROWN;
      for (let i = 0; i < W; i += 32) {
        const wx = i - (offset * 0.2 % 32);
        ctx.fillRect(wx, 0, 32, 10);
        ctx.fillRect(wx, H-30, 32, 30);
      }
      // Stalactites
      ctx.fillStyle = NES.GREY;
      for (let i = 0; i < 8; i++) {
        const sx = i * 100 - (offset * 0.15 % 100);
        ctx.fillRect(sx+20, 0, 10, 20+Math.sin(i*2+offset*0.02)*10);
      }
      // Glowing crystals
      ctx.fillStyle = NES.BLUE;
      for (let i = 0; i < 5; i++) {
        const gx = i * 180 - (offset * 0.1 % 180) + 50;
        ctx.fillRect(gx, 350, 8, 8);
        ctx.fillRect(gx+4, 340, 4, 10);
      }
      break;
    case 'underwater':
      // Water gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, NES.DARK_BLUE);
      grad.addColorStop(0.3, NES.BLUE);
      grad.addColorStop(0.6, '#003399');
      grad.addColorStop(1, '#001133');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      // Bubbles
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (let i = 0; i < 15; i++) {
        const bx = (i * 60 - offset * 0.3 % 60) + Math.sin(offset*0.02 + i) * 10;
        const by = (i * 45 + offset * 0.5 % 45) % H;
        ctx.beginPath();
        ctx.arc(bx, by, 3 + Math.sin(i)*2, 0, Math.PI*2);
        ctx.fill();
      }
      // Seaweed
      ctx.fillStyle = NES.DARK_GREEN;
      for (let i = 0; i < 6; i++) {
        const sx = i * 140 - (offset * 0.2 % 140);
        ctx.fillRect(sx, 500, 8, 100 + Math.sin(offset*0.03 + i)*20);
        ctx.fillStyle = NES.GREEN;
        ctx.fillRect(sx-3, 480 + Math.sin(offset*0.03 + i)*20, 14, 30);
        ctx.fillStyle = NES.DARK_GREEN;
      }
      break;
    case 'castle':
      // Dark background
      ctx.fillStyle = '#1a0000';
      ctx.fillRect(0, 0, W, H);
      // Lava
      ctx.fillStyle = NES.RED;
      ctx.fillRect(0, H-20, W, 20);
      ctx.fillStyle = NES.ORANGE;
      ctx.fillRect(0, H-15, W, 5);
      for (let i = 0; i < W; i += 10) {
        const lavaH = Math.sin(offset*0.05 + i*0.1) * 5;
        ctx.fillStyle = NES.YELLOW;
        ctx.fillRect(i, H-15+lavaH, 8, 3);
      }
      // Castle walls
      ctx.fillStyle = NES.DARK_GREY;
      for (let i = 0; i < 8; i++) {
        const wx = i * 100 - (offset * 0.2 % 100);
        ctx.fillRect(wx, 100, 40, 400);
        ctx.fillRect(wx+10, 90, 20, 10);
        // Windows
        ctx.fillStyle = NES.ORANGE;
        ctx.fillRect(wx+10, 200, 20, 30);
        ctx.fillStyle = NES.DARK_GREY;
      }
      break;
  }

  // Ground
  if (theme !== 'underwater' && theme !== 'castle') {
    ctx.fillStyle = NES.GREEN;
    ctx.fillRect(0, H-40, W, 40);
    ctx.fillStyle = NES.BROWN;
    ctx.fillRect(0, H-30, W, 30);
    // Grass pattern
    ctx.fillStyle = NES.DARK_GREEN;
    for (let i = 0; i < W; i += 16) {
      ctx.fillRect(i, H-40, 2, 5);
      ctx.fillRect(i+8, H-40, 2, 5);
    }
  }
}

function renderGameplay() {
  const config = getLevelConfig();
  drawBackground(config.theme);

  // Draw ground for underwater/castle
  if (config.theme === 'underwater') {
    ctx.fillStyle = NES.BROWN;
    ctx.fillRect(0, H-30, W, 30);
    ctx.fillStyle = NES.DARK_GREEN;
    ctx.fillRect(0, H-30, W, 5);
  }
  if (config.theme === 'castle') {
    ctx.fillStyle = NES.DARK_GREY;
    ctx.fillRect(0, H-30, W, 30);
  }

  // Draw ?-blocks
  game.blocks.forEach(b => {
    if (!b.used) {
      drawQBlock(ctx, b.x, b.y, game.frameCount);
    }
  });

  // Draw powerups
  game.powerups.forEach(p => {
    const s = 8;
    switch(p.type) {
      case 'mushroom':
        ctx.fillStyle = NES.RED;
        ctx.fillRect(p.x, p.y, 16, 16);
        ctx.fillStyle = NES.WHITE;
        ctx.fillRect(p.x+4, p.y+4, 8, 4);
        break;
      case 'flower':
        ctx.fillStyle = NES.ORANGE;
        ctx.beginPath();
        ctx.arc(p.x+8, p.y+8, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = NES.GREEN;
        ctx.fillRect(p.x+6, p.y+12, 4, 8);
        break;
      case 'star':
        ctx.fillStyle = NES.YELLOW;
        // Simple star shape
        for (let i = 0; i < 5; i++) {
          const angle = (i * 4 * Math.PI / 5) - Math.PI/2;
          const px = p.x + 8 + Math.cos(angle) * 8;
          const py = p.y + 8 + Math.sin(angle) * 8;
          ctx.fillRect(px-2, py-2, 4, 4);
        }
        break;
      case 'clock':
        ctx.fillStyle = NES.YELLOW;
        ctx.beginPath();
        ctx.arc(p.x+8, p.y+8, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = NES.BLACK;
        ctx.fillRect(p.x+7, p.y+4, 2, 5);
        ctx.fillRect(p.x+7, p.y+7, 5, 2);
        break;
      case 'oneup':
        ctx.fillStyle = NES.GREEN;
        ctx.fillRect(p.x+2, p.y, 12, 16);
        ctx.fillStyle = NES.WHITE;
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('1', p.x+8, p.y+12);
        break;
    }
  });

  // Draw enemies
  game.enemiesOnScreen.forEach(e => {
    if (!e.alive && e.deathTimer <= 0) return;

    ctx.save();

    // Boss intro glow
    if (e.isBoss && game.showBossIntro) {
      ctx.fillStyle = 'rgba(255,200,0,0.2)';
      ctx.beginPath();
      ctx.arc(e.x+30, e.y+20, 60, 0, Math.PI*2);
      ctx.fill();
    }

    // Flash effect
    if (e.wrongFlash && e.flashTimer > 0) {
      ctx.fillStyle = 'rgba(255,0,0,0.3)';
      ctx.fillRect(e.x-5, e.y-5, 70, 60);
    }

    if (!e.alive && e.deathTimer > 0) {
      // Death animation - squish and fade
      ctx.globalAlpha = e.deathTimer / 20;
      ctx.scale(1, 0.3 + 0.7 * (e.deathTimer/20));
      ctx.translate(0, 30);
    }

    // Draw enemy sprite
    switch(e.type) {
      case 'goomba': drawGoomba(ctx, e.x, e.y, e.frame, e.scale); break;
      case 'koopa': drawKoopa(ctx, e.x, e.y, e.frame, e.scale); break;
      case 'piranha': drawPiranha(ctx, e.x, e.y, e.frame, e.scale); break;
      case 'boss_goomba':
        drawGoomba(ctx, e.x, e.y, e.frame, 2);
        // Boss crown
        ctx.fillStyle = NES.YELLOW;
        ctx.fillRect(e.x+10, e.y-10, 20, 8);
        ctx.fillRect(e.x+15, e.y-18, 10, 10);
        break;
      case 'boss_koopa':
        drawKoopa(ctx, e.x, e.y, e.frame, 2);
        ctx.fillStyle = NES.YELLOW;
        ctx.fillRect(e.x+10, e.y-10, 20, 8);
        ctx.fillRect(e.x+15, e.y-18, 10, 10);
        break;
      case 'boss_piranha':
        drawPiranha(ctx, e.x, e.y, e.frame, 2);
        ctx.fillStyle = NES.YELLOW;
        ctx.fillRect(e.x+10, e.y-10, 20, 8);
        break;
      case 'boss_bowser':
        drawBowser(ctx, e.x, e.y, e.frame, e.scale);
        break;
    }

    ctx.restore();

    // Word above enemy
    if (e.alive && e.deathTimer <= 0) {
      const wordY = e.y - (e.isBoss ? 40 : 20);
      const wordX = e.x + (e.isBoss ? 25 : 20);

      // Word background
      const wordWidth = e.word.length * 8;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(wordX - wordWidth/2 - 4, wordY - 12, wordWidth + 8, 18);

      // Typed portion (green)
      if (e.typedSoFar.length > 0) {
        ctx.fillStyle = NES.GREEN;
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.typedSoFar, wordX - (e.word.length - e.typedSoFar.length) * 4, wordY);
      }

      // Remaining portion
      const remaining = e.word.substring(e.typedSoFar.length);
      ctx.fillStyle = e.wrongFlash && e.flashTimer > 0 ? NES.RED : NES.WHITE;
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(remaining, wordX + e.typedSoFar.length * 4, wordY);

      // HP bar for bosses
      if (e.isBoss) {
        const hpWidth = 60;
        const hpY = wordY + 15;
        ctx.fillStyle = NES.DARK_GREY;
        ctx.fillRect(wordX - hpWidth/2, hpY, hpWidth, 6);
        ctx.fillStyle = NES.RED;
        ctx.fillRect(wordX - hpWidth/2, hpY, hpWidth * (e.hp / e.maxHp), 6);
        ctx.fillStyle = NES.WHITE;
        ctx.font = '7px monospace';
        ctx.fillText(`${e.hp}/${e.maxHp}`, wordX, hpY + 6);
      }
    }
  });

  // Draw particles
  game.particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Draw player (Mario, static on left side)
  const marioX = 30;
  const marioY = H - 80;
  drawMario(ctx, marioX, marioY, Math.floor(game.frameCount/8) % 2);

  // Draw HUD
  drawHUD();

  // Typing bar
  drawTypingBar();
}

function drawHUD() {
  const config = getLevelConfig();

  // Top bar background
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, 40);

  // Score
  ctx.fillStyle = NES.WHITE;
  ctx.font = '14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${game.score}`, 10, 16);

  // Lives
  ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0, game.lives))}`, 10, 34);

  // Level name
  ctx.textAlign = 'center';
  ctx.fillStyle = NES.YELLOW;
  ctx.fillText(`WORLD ${config.world}-${config.level}: ${config.name}`, W/2, 16);

  // Combo
  if (game.combo > 1) {
    ctx.fillStyle = NES.ORANGE;
    ctx.textAlign = 'right';
    ctx.fillText(`COMBO x${game.combo}`, W - 10, 16);
  }

  // Power-up indicators
  ctx.textAlign = 'right';
  let puY = 34;
  if (game.activePowerups.mushroom > 0) {
    ctx.fillStyle = NES.RED;
    ctx.fillText(`MUSHROOM ${Math.ceil(game.activePowerups.mushroom/60)}s`, W-10, puY);
    puY += 14;
  }
  if (game.activePowerups.star > 0) {
    ctx.fillStyle = NES.YELLOW;
    ctx.fillText(`STAR ${Math.ceil(game.activePowerups.star/60)}s`, W-10, puY);
    puY += 14;
  }
  if (game.activePowerups.flower > 0) {
    ctx.fillStyle = NES.ORANGE;
    ctx.fillText(`FIRE x${game.activePowerups.flower}`, W-10, puY);
    puY += 14;
  }
  if (game.activePowerups.clock > 0) {
    ctx.fillStyle = NES.BLUE;
    ctx.fillText(`SLOW ${Math.ceil(game.activePowerups.clock/60)}s`, W-10, puY);
  }
}

function drawTypingBar() {
  // Typing bar at bottom
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, H - 60, W, 60);

  ctx.fillStyle = NES.WHITE;
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('TYPE:', 10, H - 30);

  if (game.activeEnemy && game.activeEnemy.alive) {
    const e = game.activeEnemy;
    const wordX = 80;
    const wordY = H - 28;

    // Show typed part in green
    if (e.typedSoFar.length > 0) {
      ctx.fillStyle = NES.GREEN;
      ctx.font = '20px monospace';
      ctx.fillText(e.typedSoFar, wordX, wordY);
    }
    // Show remaining part
    const remaining = e.word.substring(e.typedSoFar.length);
    ctx.fillStyle = NES.WHITE;
    ctx.font = '20px monospace';
    ctx.fillText(remaining, wordX + e.typedSoFar.length * 12, wordY);

    // Character preview
    if (e.typedSoFar.length < e.word.length) {
      ctx.fillStyle = NES.YELLOW;
      ctx.font = '12px monospace';
      ctx.fillText(`Next: ${e.word[e.typedSoFar.length]}`, wordX, wordY + 25);
    }
  } else {
    ctx.fillStyle = NES.GREY;
    ctx.font = '16px monospace';
    ctx.fillText('Waiting for enemies...', 80, H - 28);
  }
}

function renderTitle() {
  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, NES.SKY);
  grad.addColorStop(0.6, '#3a8cfc');
  grad.addColorStop(1, NES.GREEN);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Hills
  ctx.fillStyle = NES.DARK_GREEN;
  ctx.beginPath();
  ctx.arc(150, 580, 120, Math.PI, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(500, 600, 150, Math.PI, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(700, 580, 100, Math.PI, 0);
  ctx.fill();

  // Ground
  ctx.fillStyle = NES.GREEN;
  ctx.fillRect(0, H-40, W, 40);
  ctx.fillStyle = NES.BROWN;
  ctx.fillRect(0, H-30, W, 30);

  // Clouds
  ctx.fillStyle = NES.WHITE;
  for (let i = 0; i < 4; i++) {
    const cx = i * 200 + Math.sin(game.bgOffset*0.02 + i) * 20;
    ctx.fillRect(cx, 70, 80, 20);
    ctx.fillRect(cx+15, 55, 50, 20);
    ctx.fillRect(cx+30, 45, 25, 15);
  }

  // Title
  ctx.fillStyle = NES.RED;
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SUPER MARIO', W/2, 180);

  ctx.fillStyle = NES.YELLOW;
  ctx.font = 'bold 36px monospace';
  ctx.fillText('TYPING GAME', W/2, 230);

  // Mario
  drawMario(ctx, W/2 - 16, 260, Math.floor(game.bgOffset/10) % 2);

  // Menu
  ctx.fillStyle = NES.WHITE;
  ctx.font = '20px monospace';
  ctx.fillText('Press ENTER to Start', W/2, 380);

  ctx.font = '16px monospace';
  ctx.fillStyle = NES.YELLOW;
  ctx.fillText('Difficulty:', W/2, 430);
  const diffs = ['Easy', 'Medium', 'Hard', 'Expert'];
  diffs.forEach((d, i) => {
    ctx.fillStyle = i === game.menuSelection ? NES.RED : NES.WHITE;
    ctx.fillText(d, W/2 - 80 + i * 60, 460);
    if (i === game.menuSelection) {
      ctx.fillText('▼', W/2 - 80 + i * 60, 478);
    }
  });

  // High scores button
  ctx.fillStyle = NES.GREY;
  ctx.font = '14px monospace';
  ctx.fillText('[H] High Scores', W/2, 530);

  // Instructions
  ctx.fillStyle = NES.WHITE;
  ctx.font = '12px monospace';
  ctx.fillText('Type words on enemies to defeat them!', W/2, 580);
  ctx.fillText('Type the word above each enemy before it reaches you.', W/2, 600);
  ctx.fillText('← → Select Difficulty  |  ENTER Start  |  ESC Pause', W/2, 640);

  // Floating particles
  for (let i = 0; i < 20; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(game.bgOffset*0.05 + i)*0.1})`;
    const px = (i * 40 + game.bgOffset * 0.3) % W;
    const py = (i * 37 + game.bgOffset * 0.2) % H;
    ctx.fillRect(px, py, 2, 2);
  }
}

function renderLevelSelect() {
  // Background
  ctx.fillStyle = NES.DARK_BLUE;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = NES.YELLOW;
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SELECT LEVEL', W/2, 50);

  // World map
  const cols = 4;
  const startX = 80;
  const startY = 100;
  const spacingX = 160;
  const spacingY = 130;

  LEVEL_CONFIGS.forEach((level, i) => {
    const col = (i % cols);
    const row = Math.floor(i / cols);
    const lx = startX + col * spacingX;
    const ly = startY + row * spacingY;

    const completed = game.progress[`${level.world}-${level.level}`];
    const isUnlocked = i === 0 || game.progress[`${LEVEL_CONFIGS[i-1].world}-${LEVEL_CONFIGS[i-1].level}`];

    // Level box
    ctx.fillStyle = i === game.levelIndex ? NES.RED : (completed ? NES.DARK_GREEN : NES.DARK_GREY);
    ctx.fillRect(lx - 50, ly - 20, 130, 60);

    // Level border
    ctx.strokeStyle = i === game.levelIndex ? NES.YELLOW : NES.GREY;
    ctx.lineWidth = 2;
    ctx.strokeRect(lx - 50, ly - 20, 130, 60);

    // Level name
    ctx.fillStyle = NES.WHITE;
    ctx.font = '11px monospace';
    ctx.fillText(`World ${level.world}-${level.level}`, lx + 15, ly);

    // Level name
    ctx.font = '10px monospace';
    ctx.fillStyle = NES.GREY;
    ctx.fillText(level.name.substring(0, 12), lx + 15, ly + 15);

    // Stars
    if (completed) {
      const stars = completed.stars || 0;
      ctx.fillStyle = NES.YELLOW;
      for (let s = 0; s < stars; s++) {
        ctx.fillText('★', lx + 10 + s * 20, ly + 35);
      }
      ctx.fillStyle = NES.DARK_GREY;
      for (let s = stars; s < 3; s++) {
        ctx.fillText('★', lx + 10 + s * 20, ly + 35);
      }
    } else if (i === 0 || game.progress[`${LEVEL_CONFIGS[i-1].world}-${LEVEL_CONFIGS[i-1].level}`]) {
      ctx.fillStyle = NES.YELLOW;
      ctx.font = '10px monospace';
      ctx.fillText('NEW', lx + 40, ly + 35);
    } else {
      ctx.fillStyle = NES.RED;
      ctx.font = '16px monospace';
      ctx.fillText('🔒', lx + 40, ly + 33);
    }
  });

  // Navigation
  ctx.fillStyle = NES.WHITE;
  ctx.font = '14px monospace';
  ctx.fillText('← → Select  |  ENTER Play  |  ESC Back', W/2, H - 20);
}

function renderPause() {
  // Keep gameplay visible but dimmed
  renderGameplay();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = NES.WHITE;
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W/2, H/2 - 30);

  ctx.font = '20px monospace';
  ctx.fillStyle = NES.YELLOW;
  ctx.fillText('Press ESC to Resume', W/2, H/2 + 30);
  ctx.fillStyle = NES.GREY;
  ctx.font = '14px monospace';
  ctx.fillText('Press Q to Quit', W/2, H/2 + 60);
}

function renderGameOver() {
  // Dark background
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(0, 0, W, H);

  // Game Over text
  ctx.fillStyle = NES.RED;
  ctx.font = 'bold 56px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, 200);

  // Score
  ctx.fillStyle = NES.YELLOW;
  ctx.font = '28px monospace';
  ctx.fillText(`Final Score: ${game.score}`, W/2, 280);

  // Stats
  ctx.fillStyle = NES.WHITE;
  ctx.font = '16px monospace';
  ctx.fillText(`Enemies Defeated: ${game.totalDefeated}`, W/2, 330);
  ctx.fillText(`Max Combo: x${game.maxCombo}`, W/2, 360);
  ctx.fillText(`Accuracy: ${game.totalTyped > 0 ? Math.round(game.correctTyped/game.totalTyped*100) : 0}%`, W/2, 390);

  // Continue option
  if (game.continueLives > 0 && game.gameOverTimer <= 0) {
    ctx.fillStyle = NES.GREEN;
    ctx.font = '20px monospace';
    ctx.fillText('Press ENTER to Continue (3 lives)', W/2, 450);
    ctx.fillStyle = NES.GREY;
    ctx.font = '14px monospace';
    ctx.fillText('Press Q to return to Title', W/2, 480);
  } else if (game.gameOverTimer > 0) {
    ctx.fillStyle = NES.GREY;
    ctx.font = '16px monospace';
    ctx.fillText(`Continuing in ${Math.ceil(game.gameOverTimer/60)}...`, W/2, 450);
  }

  // Star particles
  for (let i = 0; i < 30; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.05 + Math.sin(game.frameCount*0.05 + i)*0.05})`;
    const px = (i * 26 + game.frameCount * 0.5) % W;
    const py = (i * 33 + game.frameCount * 0.3) % H;
    ctx.fillRect(px, py, 3, 3);
  }
}

function renderContinue() {
  // Dark background
  ctx.fillStyle = NES.BLACK;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = NES.GREEN;
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('CONTINUE?', W/2, 200);

  ctx.fillStyle = NES.WHITE;
  ctx.font = '20px monospace';
  ctx.fillText(`3 lives awarded!`, W/2, 260);

  ctx.fillStyle = NES.YELLOW;
  ctx.font = '18px monospace';
  ctx.fillText('Press ENTER to Continue', W/2, 320);
  ctx.fillStyle = NES.GREY;
  ctx.fillText('Press Q to Return to Title', W/2, 350);
}

function renderVictory() {
  // Keep gameplay visible
  renderGameplay();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = NES.YELLOW;
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL CLEAR!', W/2, 200);

  ctx.fillStyle = NES.WHITE;
  ctx.font = '24px monospace';
  ctx.fillText(`Score: ${game.score}`, W/2, 270);

  // Star rating
  const accuracy = game.totalTyped > 0 ? game.correctTyped/game.totalTyped : 1;
  let stars = 1;
  if (accuracy > 0.8 && game.combo > 3) stars = 3;
  else if (accuracy > 0.6) stars = 2;

  game.starsEarned = stars;
  ctx.fillStyle = NES.YELLOW;
  ctx.font = '36px monospace';
  let starStr = '';
  for (let s = 0; s < 3; s++) starStr += s < stars ? '★' : '☆';
  ctx.fillText(starStr, W/2, 330);

  ctx.fillStyle = NES.ORANGE;
  ctx.font = '16px monospace';
  ctx.fillText(`Accuracy: ${Math.round(accuracy*100)}% | Max Combo: x${game.maxCombo}`, W/2, 370);

  // Save progress
  const config = getLevelConfig();
  const key = `${config.world}-${config.level}`;
  if (!game.progress[key] || game.progress[key].stars < stars) {
    game.progress[key] = { stars: stars, completed: true };
    localStorage.setItem('marioTypingProgress', JSON.stringify(game.progress));
  }

  const isLastLevel = game.levelIndex >= LEVEL_CONFIGS.length - 1;
  ctx.fillStyle = NES.GREEN;
  ctx.font = '20px monospace';
  if (isLastLevel) {
    ctx.fillText('Congratulations! You beat the game!', W/2, 420);
    ctx.fillStyle = NES.WHITE;
    ctx.font = '16px monospace';
    ctx.fillText('Press ENTER for Title Screen', W/2, 460);
  } else {
    ctx.fillText('Press ENTER for Next Level', W/2, 420);
    ctx.fillStyle = NES.GREY;
    ctx.font = '14px monospace';
    ctx.fillText('Press Q for Level Select', W/2, 450);
  }

  // Confetti
  for (let i = 0; i < 40; i++) {
    const colors = [NES.RED, NES.YELLOW, NES.GREEN, NES.BLUE, NES.ORANGE];
    ctx.fillStyle = colors[rand(0, 4)];
    const px = (i * 20 + game.frameCount * 2) % W;
    const py = (i * 18 + game.frameCount * 1.5) % (H * 0.5);
    ctx.fillRect(px, py, 4, 8);
  }
}

function renderLeaderboard() {
  ctx.fillStyle = NES.DARK_BLUE;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = NES.YELLOW;
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HIGH SCORES', W/2, 60);

  if (game.leaderboard.length === 0) {
    ctx.fillStyle = NES.WHITE;
    ctx.font = '18px monospace';
    ctx.fillText('No scores yet!', W/2, 200);
  } else {
    // Sort by score descending
    const scores = [...game.leaderboard].sort((a, b) => b.score - a.score).slice(0, 10);

    ctx.fillStyle = NES.GREY;
    ctx.font = '14px monospace';
    ctx.fillText('RANK', 100, 120);
    ctx.fillText('SCORE', 250, 120);
    ctx.fillText('LEVEL', 400, 120);
    ctx.fillText('DATE', 520, 120);

    ctx.strokeStyle = NES.GREY;
    ctx.beginPath();
    ctx.moveTo(60, 125);
    ctx.lineTo(700, 125);
    ctx.stroke();

    scores.forEach((s, i) => {
      const y = 150 + i * 35;
      ctx.fillStyle = i < 3 ? NES.YELLOW : NES.WHITE;
      ctx.font = '16px monospace';
      const rankStr = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
      ctx.fillText(rankStr, 100, y);
      ctx.fillText(s.score.toString(), 250, y);
      ctx.fillText(s.level || 'N/A', 400, y);
      ctx.fillText(s.date || '', 520, y);
    });
  }

  ctx.fillStyle = NES.GREY;
  ctx.font = '14px monospace';
  ctx.fillText('Press ESC to Return', W/2, H - 30);
}

function renderBossIntro() {
  renderGameplay();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = NES.RED;
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';

  const config = getLevelConfig();
  const bossName = config.bossType.charAt(0).toUpperCase() + config.bossType.slice(1);
  ctx.fillText(`BOSS: ${bossName}`, W/2, H/2);
}

// ============================================================
// INPUT HANDLING
// ============================================================
const keys = {};
document.addEventListener('keydown', (e) => {
  keys[e.key] = true;

  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    initAudio();

    switch(game.state) {
      case STATE.TITLE:
        game.state = STATE.LEVEL_SELECT;
        game.levelIndex = 0;
        playSFX('coin');
        break;
      case STATE.LEVEL_SELECT:
        startLevel(game.levelIndex);
        break;
      case STATE.GAMEOVER:
        if (game.gameOverTimer <= 0) {
          // Continue
          game.state = STATE.GAMEPLAY;
          game.lives = game.continueLives;
          game.continueLives = Math.min(5, game.continueLives + 1);
          game.enemiesOnScreen = [];
          const config = getLevelConfig();
          startMusic(config.theme);
          setTimeout(() => spawnWave(), 500);
        }
        break;
      case STATE.CONTINUE:
        game.state = STATE.GAMEPLAY;
        game.lives = 3;
        game.enemiesOnScreen = [];
        const cfg = getLevelConfig();
        startMusic(cfg.theme);
        setTimeout(() => spawnWave(), 500);
        break;
      case STATE.VICTORY:
        if (game.levelIndex >= LEVEL_CONFIGS.length - 1) {
          game.state = STATE.TITLE;
          stopMusic();
        } else {
          game.levelIndex++;
          startLevel(game.levelIndex);
        }
        break;
    }
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    initAudio();
    switch(game.state) {
      case STATE.GAMEPLAY:
        game.state = STATE.PAUSE;
        stopMusic();
        break;
      case STATE.PAUSE:
        game.state = STATE.GAMEPLAY;
        const cfg = getLevelConfig();
        startMusic(cfg.theme);
        break;
      case STATE.LEADERBOARD:
        game.state = STATE.TITLE;
        break;
      case STATE.LEVEL_SELECT:
        game.state = STATE.TITLE;
        break;
    }
  }

  if (e.key === 'q' || e.key === 'Q') {
    switch(game.state) {
      case STATE.PAUSE:
        game.state = STATE.TITLE;
        stopMusic();
        break;
      case STATE.GAMEOVER:
        if (game.gameOverTimer <= 0) {
          game.state = STATE.TITLE;
        }
        break;
      case STATE.CONTINUE:
        game.state = STATE.TITLE;
        break;
      case STATE.VICTORY:
        game.state = STATE.LEVEL_SELECT;
        break;
    }
  }

  if (e.key === 'h' || e.key === 'H') {
    if (game.state === STATE.TITLE) {
      initAudio();
      game.state = STATE.LEADERBOARD;
    }
  }

  // Arrow keys for menu navigation
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (game.state === STATE.TITLE) {
      game.menuSelection = Math.max(0, game.menuSelection - 1);
    }
    if (game.state === STATE.LEVEL_SELECT) {
      game.levelIndex = Math.max(0, game.levelIndex - 1);
    }
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (game.state === STATE.TITLE) {
      game.menuSelection = Math.min(3, game.menuSelection + 1);
    }
    if (game.state === STATE.LEVEL_SELECT) {
      game.levelIndex = Math.min(LEVEL_CONFIGS.length - 1, game.levelIndex + 1);
    }
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (game.state === STATE.LEVEL_SELECT) {
      const cols = 4;
      if (e.key === 'ArrowUp') game.levelIndex = Math.max(0, game.levelIndex - cols);
      else game.levelIndex = Math.min(LEVEL_CONFIGS.length - 1, game.levelIndex + cols);
    }
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// ============================================================
// TYPING INPUT
// ============================================================
// We listen for printable characters
document.addEventListener('keypress', (e) => {
  if (e.key.length === 1) {
    // Only handle during gameplay
    if (game.state === STATE.GAMEPLAY) {
      e.preventDefault();
      const char = e.key.toLowerCase();
      if (/^[a-zA-Z0-9 '-]$/.test(char)) {
        handleTyping(char);
      }
    }
  }
});

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = 0;
let fpsCounter = 0;
let fpsTime = 0;

function gameLoop(timestamp) {
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  // FPS counter
  fpsCounter++;
  if (timestamp - fpsTime > 1000) {
    game.fps = fpsCounter;
    fpsCounter = 0;
    fpsTime = timestamp;
  }

  // Update at 60fps rate
  update();

  // Render
  render();

  requestAnimationFrame(gameLoop);
}

// ============================================================
// SAVE LEADERBOARD
// ============================================================
function saveScore(name) {
  const config = getLevelConfig();
  const entry = {
    name: name || 'Player',
    score: game.score,
    level: `World ${config.world}-${config.level}`,
    date: new Date().toLocaleDateString(),
  };
  game.leaderboard.push(entry);
  game.leaderboard.sort((a, b) => b.score - a.score);
  if (game.leaderboard.length > 10) game.leaderboard = game.leaderboard.slice(0, 10);
  localStorage.setItem('marioTypingLeaderboard', JSON.stringify(game.leaderboard));
}

// ============================================================
// START
// ============================================================
function startGame() {
  // Focus on typing input
  input.focus();
  document.addEventListener('click', () => {
    input.focus();
    initAudio();
  });

  // Set difficulty from menu selection
  const difficulties = ['easy', 'medium', 'hard', 'expert'];
  game.difficulty = difficulties[game.menuSelection] || 'easy';

  requestAnimationFrame(gameLoop);
}

startGame();
