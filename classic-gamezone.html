<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic GameZone - Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0b0b;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .frame-wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1rem;
    background: linear-gradient(180deg, #141414, #0f0f0f);
    border-bottom: 1px solid #222;
    gap: 1rem;
  }
  .topbar a {
    color: #e5e5e5;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.25rem 0.4rem;
    border-radius: 6px;
  }
  .topbar a:hover { background: #1f1f1f; }
  .brand { font-weight: 700; color: #ff3b3b; }
  iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: #fff;
  }
  .fallback {
    padding: 2rem;
    color: #ffb4b4;
  }
</style>
</head>
<body>
  <div class="frame-wrap">
    <div class="topbar">
      <a class="brand" href="/">🎮 Arcade</a>
      <a href="http://localhost:8002/classic-gamezone.html" target="_self">Reload</a>
      <a href="https://classicgamezone.com" target="_blank" rel="noopener">Open original ↗</a>
    </div>
    <iframe id="cgz-frame" src="https://classicgamezone.com" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" title="Classic GameZone"></iframe><script>(function(){var iframe=document.getElementById('cgz-frame');var fromHash=location.hash.replace(/^#/, '');if(fromHash&&/^https?:\/\//i.test(fromHash)){iframe.src=fromHash;}})();</script>
  </div>
</body>
</html>
